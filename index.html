<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dumps</title>
<style>
  :root{
    --bg:#0f1724; --muted:#94a3b8; --accent:#7c3aed;
  }
  body{
    font-family:Inter,ui-sans-serif;
    margin:0;background:#0a0f1c;color:#e6eef8;
  }
  header{
    padding:22px;border-bottom:1px solid rgba(255,255,255,0.08);
  }
  h1{margin:0;font-size:22px;font-weight:600}

  .container{max-width:1100px;margin:24px auto;padding:0 20px}

  .controls{
    display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;
  }
  input[type=search], select{
    padding:10px 12px;border-radius:10px;
    background:#111827;border:1px solid rgba(255,255,255,0.08);
    color:white;
  }

  .grid{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{
    background:#101623;padding:16px;border-radius:12px;
    border:1px solid rgba(255,255,255,0.05);
  }
  .meta{font-size:13px;color:var(--muted);margin-bottom:8px}
  .title{font-size:17px;font-weight:600;margin-bottom:10px}
  .small{font-size:13px;color:var(--muted);margin-bottom:14px}

  a.download{
    display:block;text-decoration:none;text-align:center;
    padding:12px;border-radius:10px;background:var(--accent);
    color:white;font-weight:600;
  }

  #empty{text-align:center;padding:40px;color:var(--muted)}

  footer{
    text-align:center;padding:20px;color:var(--muted);
    margin-top:30px;font-size:13px;
  }
</style>
</head>
<body>

<header>
  <h1>Dumps</h1>
</header>

<div class="container">

  <div class="controls">
    <input id="search" type="search" placeholder="Search builds..."/>
    <select id="filterPlatform">
      <option value="">All Platforms</option>
      <option>Windows</option>
      <option>Android</option>
    </select>
    <select id="sort">
      <option value="new">Newest</option>
      <option value="alpha">A → Z</option>
    </select>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" style="display:none">No builds found.</div>

</div>

<footer>Static Demo Template — Replace download links with your own files.</footer>

<script>
let manifest = [
  {
    id: "demo1",
    name: "Example Unity Build — Windows",
    url: "downloads/example1.zip",
    size: "68 MB",
    platform: "Windows",
    date: "2025-01-01T10:00:00Z"
  },
  {
    id: "demo2",
    name: "Example Unity Build — Android",
    url: "downloads/example2.apk",
    size: "54 MB",
    platform: "Android",
    date: "2024-12-10T09:00:00Z"
  }
];

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const searchInput = document.getElementById('search');
const filterPlatform = document.getElementById('filterPlatform');
const sortSelect = document.getElementById('sort');

function render(items){
  grid.innerHTML = "";
  if(items.length === 0){
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  items.forEach(it=>{
    const c = document.createElement('div');
    c.className = "card";
    c.innerHTML = `
      <div class="meta">${new Date(it.date).toLocaleDateString()} • ${it.platform}</div>
      <div class="title">${it.name}</div>
      <div class="small">${it.size}</div>
      <a class="download" href="${it.url}" download>Download</a>
    `;
    grid.appendChild(c);
  });
}

function filter(){
  const q = searchInput.value.toLowerCase().trim();
  const pf = filterPlatform.value;

  let out = manifest.filter(m=>{
    if(pf && m.platform !== pf) return false;
    if(!q) return true;
    return m.name.toLowerCase().includes(q);
  });

  if(sortSelect.value === "new")
    out.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(sortSelect.value === "alpha")
    out.sort((a,b)=>a.name.localeCompare(b.name));

  render(out);
}

searchInput.addEventListener('input', filter);
filterPlatform.addEventListener('change', filter);
sortSelect.addEventListener('change', filter);

filter();
</script>

</body>
</html>
